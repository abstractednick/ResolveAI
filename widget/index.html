<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ResolveAI Deflection Widget</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --ink: #0f1c2e;
        --sea: #1f6f8b;
        --sand: #f7f3ef;
      }
      body {
        margin: 0;
        font-family: "Source Sans 3", system-ui, sans-serif;
        background: linear-gradient(160deg, #f7f3ef, #e8eef6);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .demo {
        width: min(420px, 92vw);
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }
      p {
        color: rgba(15, 28, 46, 0.65);
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="demo">
      <h1>ResolveAI</h1>
      <p>Self-service deflection widget demo. Set tenant API key below, then ask a question.</p>
      <div id="resolveai-widget" data-api="http://localhost:8000"></div>
    </div>
    <script src="./resolveai-widget.js"></script>
  </body>
</html>
